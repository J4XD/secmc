# Copy to scope.yaml and list only targets you are authorized to test.

# IPs, CIDRs, exact domains and wildcard domains.
# "*.example.com" matches subdomains only; list "example.com" too for the apex.
allow:
  - scanme.nmap.org
  - 203.0.113.0/24
  - example.com
  - "*.example.com"

# Exclusions always win, including for addresses a domain resolves to.
exclude:
  - 203.0.113.1
  - admin.example.com
  - "*.internal.example.com"

# Dangerous options (intrusive, exploit, dos and brute nmap scripts, and
# intrusive nuclei tags) run only when this is true AND the call passes confirm=true.
allow_dangerous: false

max_concurrency: 2
max_output_bytes: 20000

timeouts:
  nmap: 900
  httpx: 600
  ffuf: 1800
  nuclei: 3600

# Requests per second for the web tools. A call may ask for less, never more.
rate_limits:
  httpx: 50
  ffuf: 50
  nuclei: 50

# ffuf only reads wordlists inside these directories.
wordlist_dirs:
  - /usr/share/seclists
  - /usr/share/wordlists

# Audit log and raw tool output. Relative paths resolve against this file.
data_dir: ~/.local/share/secmcp

# Optional: path to nmap's script.db if it is not found next to the nmap binary.
# nmap_script_db: /usr/share/nmap/scripts/script.db

# Optional: binary paths, if a tool is not on PATH or the wrong one is found first.
# binaries:
#   httpx: ~/go/bin/httpx
