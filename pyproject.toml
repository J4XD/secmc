[project]
name = "secmcp"
version = "0.1.0"
description = "MCP server for authorized security testing tools with scope and flag policy enforcement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "defusedxml>=0.7.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
secmcp = "secmcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
